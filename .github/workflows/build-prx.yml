# Build scripthook.prx di GitHub Actions (OpenOrbis + GoldHEN Plugin SDK).
#
# Workflow ini BELUM diuji. Dua hal yang tidak bisa dipastikan saat ditulis:
#   1. nama aset rilis OpenOrbis (dicari otomatis, lihat langkah "Unduh OpenOrbis")
#   2. isi Makefile plugin contoh GoldHEN (dipakai sebagai kerangka build, isinya dicetak ke log)
# Kalau gagal, unduh artifact "build-log" dan kirim ke Claude.
name: build-prx

on:
  workflow_dispatch:
    inputs:
      template_plugin:
        description: "Nama folder plugin contoh di GoldHEN_Plugins_Repository (kerangka Makefile)"
        required: false
        default: "no_share_watermark"
      lua_version:
        description: "Versi Lua 5.4.x"
        required: false
        default: "5.4.7"

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      TEMPLATE_PLUGIN: ${{ inputs.template_plugin || 'no_share_watermark' }}
      LUA_VERSION: ${{ inputs.lua_version || '5.4.7' }}
    steps:
      - uses: actions/checkout@v4

      - name: Paket build
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld make curl unzip python3 git

      - name: Unduh OpenOrbis toolchain
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          mkdir -p logs
          gh release view --repo OpenOrbis/OpenOrbis-PS4-Toolchain --json tagName,assets \
            -q '.tagName as $t | .assets[] | "\($t) \(.name)"' | tee logs/oo-assets.txt
          # pilih aset Linux; kalau tidak ada, aset zip/tar pertama
          asset=$(awk '{print $2}' logs/oo-assets.txt | grep -iE 'linux' | head -n1 || true)
          if [ -z "$asset" ]; then
            asset=$(awk '{print $2}' logs/oo-assets.txt | grep -iE '\.(zip|tar\.gz|tgz)$' | head -n1 || true)
          fi
          if [ -z "$asset" ]; then
            echo "::error::Tidak ada aset yang bisa dipakai. Daftar aset ada di logs/oo-assets.txt"
            exit 1
          fi
          echo "Memakai aset: $asset"
          gh release download --repo OpenOrbis/OpenOrbis-PS4-Toolchain --pattern "$asset" --dir tc
          mkdir -p oo
          case "$asset" in
            *.zip) unzip -q "tc/$asset" -d oo ;;
            *.tar.gz|*.tgz) tar xzf "tc/$asset" -C oo ;;
            *) echo "::error::format aset tidak dikenal: $asset"; exit 1 ;;
          esac
          linkx=$(find "$PWD/oo" -name link.x | head -n1)
          if [ -z "$linkx" ]; then echo "::error::link.x tidak ditemukan di toolchain"; find oo -maxdepth 3 | head -50; exit 1; fi
          root=$(dirname "$linkx")
          echo "OO_PS4_TOOLCHAIN=$root" >> "$GITHUB_ENV"
          # alat bawaan (create-fself dll.) bisa di bin/linux atau bin
          for d in "$root/bin/linux" "$root/bin"; do
            if [ -d "$d" ]; then chmod +x "$d"/* 2>/dev/null || true; echo "$d" >> "$GITHUB_PATH"; fi
          done
          ls -la "$root" "$root/bin" 2>/dev/null | tee logs/oo-layout.txt

      - name: GoldHEN Plugin SDK
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/GoldHEN/GoldHEN_Plugins_SDK sdk
          cd sdk
          make 2>&1 | tee ../logs/sdk-build.log
          echo "GOLDHEN_SDK=$PWD" >> "$GITHUB_ENV"
          ls -la

      - name: Sumber Lua
        run: |
          set -euxo pipefail
          curl -fsSL "https://www.lua.org/ftp/lua-${LUA_VERSION}.tar.gz" -o lua.tar.gz
          mkdir -p lua-src && tar xzf lua.tar.gz -C lua-src --strip-components=1
          ls lua-src/src | head -80

      - name: Siapkan kerangka plugin
        run: |
          set -euxo pipefail
          git clone --depth 1 --recurse-submodules --shallow-submodules \
            https://github.com/GoldHEN/GoldHEN_Plugins_Repository repo
          tpl=$(find repo -maxdepth 4 -type d -name "$TEMPLATE_PLUGIN" -not -path '*/.git/*' | head -n1)
          if [ -z "$tpl" ]; then
            echo "::error::Folder plugin contoh '$TEMPLATE_PLUGIN' tidak ditemukan. Struktur repo:"
            find repo -maxdepth 3 -type d -not -path '*/.git*' | head -80
            exit 1
          fi
          echo "Kerangka: $tpl"
          rm -rf build_plugin && cp -r "$tpl" build_plugin
          { echo "== struktur kerangka =="; find build_plugin -type f | head -60; \
            echo "== Makefile kerangka =="; cat build_plugin/Makefile; } | tee logs/template.txt

          # folder sumber kerangka = folder tempat file .c/.cpp pertamanya berada
          srcfile=$(find build_plugin -type f \( -name '*.c' -o -name '*.cpp' \) | head -n1)
          if [ -z "$srcfile" ]; then echo "::error::kerangka tidak punya file .c/.cpp"; exit 1; fi
          srcdir=$(dirname "$srcfile")
          echo "Folder sumber kerangka: $srcdir"
          find build_plugin -type f \( -name '*.c' -o -name '*.cpp' -o -name '*.h' -o -name '*.hpp' \) \
            -not -path '*/GoldHEN*' -not -path '*/include/*' -delete || true

          # sumber kita
          cp src/*.c src/*.h "$srcdir"/
          # Lua inti saja: tanpa lua.c, luac.c, linit.c, io/os/package/debug
          for f in lapi lcode lctype ldebug ldo ldump lfunc lgc llex lmem lobject lopcodes lparser \
                   lstate lstring ltable ltm lundump lvm lzio lauxlib lbaselib lcorolib lmathlib \
                   lstrlib ltablib lutf8lib; do
            cp "lua-src/src/$f.c" "$srcdir"/
          done
          cp lua-src/src/*.h "$srcdir"/
          echo "$srcdir" > logs/srcdir.txt

      - name: Build
        run: |
          set -o pipefail
          cd build_plugin
          make 2>&1 | tee ../logs/plugin-build.log

      - name: Kumpulkan hasil
        run: |
          set -euxo pipefail
          mkdir -p out
          found=$(find build_plugin -name '*.prx' | head -n1)
          if [ -z "$found" ]; then echo "::error::Tidak ada file .prx dihasilkan. Lihat build-log."; exit 1; fi
          cp "$found" out/scripthook.prx
          cp scripts/example.lua scripts/scripts.txt out/
          cat > out/plugins.ini.contoh <<'EOF'
          [CUSA00419]
          /data/GoldHEN/plugins/scripthook.prx
          EOF
          sha256sum out/scripthook.prx | tee out/scripthook.prx.sha256
          ls -la out

      - name: Unggah scripthook
        uses: actions/upload-artifact@v4
        with:
          name: scripthook
          path: out/

      - name: Unggah log build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: logs/
          if-no-files-found: ignore
